[package]
name = "smart-subtitle"
version = "0.2.1"
description = "Desktop video player with smart English subtitles, LLM translations and Anki cards"
authors = ["Ilya Tyunin"]
license = "MIT"
repository = "https://github.com/Tomato1337/smart-subtitle"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "smart_subtitle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
axum = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
url = "2"
dirs = "6"
regex = "1"
futures-util = "0.3"
encoding_rs = "0.8"
json5 = "0.4"
serde_yaml = "0.9"
toml = "0.8"
