# Builds every package:
#   Fedora .rpm, Debian/Ubuntu .deb, AppImage, Arch .pkg.tar.zst (repacked .deb), macOS universal .dmg,
#   Windows NSIS installer.
# A pushed tag `v*` (e.g. `git tag v0.1.0 && git push origin v0.1.0`) attaches them to one draft release.
# A manual run only builds: the packages land in the run's artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft for every job: parallel jobs creating it themselves would race into duplicates.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            gh release create "$TAG" --draft --verify-tag --title "Smart Subtitles $TAG" --notes \
              'Fedora — `.rpm`, Debian/Ubuntu — `.deb`, любой Linux — `.AppImage`, Arch — `.pkg.tar.zst`, macOS (Apple Silicon и Intel) — `.dmg`, Windows — `-setup.exe`. Установка описана в README.'
            id=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  fedora:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: System packages
        run: |
          dnf install -y git gcc gcc-c++ make pkgconf-pkg-config openssl-devel \
            webkit2gtk4.1-devel librsvg2-devel libappindicator-gtk3-devel nodejs npm rpm-build
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --bundles rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm

  # The oldest supported Ubuntu: the .deb and the AppImage then run on newer glibc too.
  debian:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  arch:
    needs: [release, debian]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: packaging/arch
      - name: Build the package
        run: |
          pacman -Syu --noconfirm --needed base-devel github-cli jq
          version=$(jq -r .version src-tauri/tauri.conf.json)
          sed -i "s/^pkgver=.*/pkgver=${version}/" packaging/arch/PKGBUILD
          useradd -m builder
          chown -R builder packaging/arch
          cd packaging/arch
          # Dependencies are only needed to run the app, not to repack it.
          sudo -u builder makepkg --nodeps --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst
      - name: Attach to the release
        if: needs.release.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in packaging/arch/*.pkg.tar.zst; do
            gh api --method POST -H 'Content-Type: application/octet-stream' \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}/assets?name=$(basename "$f")" \
              --input "$f" > /dev/null
          done

  macos:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --bundles app,dmg --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
