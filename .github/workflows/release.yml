# Builds every package:
#   Fedora .rpm, Debian/Ubuntu .deb, AppImage, Arch .pkg.tar.zst (repacked .deb), macOS universal .dmg,
#   Windows NSIS installer.
# A pushed tag `v*` (e.g. `git tag v0.1.0 && git push origin v0.1.0`) attaches them to one draft release.
# A manual run only builds: the packages land in the run's artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tag mismatch must fail fast before building all target platforms.
  verify-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          # Packages are named after the app version: a tag that disagrees would ship 0.1.0 files as v0.2.0.
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Тег $TAG не совпадает с версией $version в src-tauri/tauri.conf.json"
            exit 1
          fi

  fedora:
    needs: verify-tag
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: System packages
        run: |
          dnf install -y git gcc gcc-c++ make pkgconf-pkg-config openssl-devel \
            webkit2gtk4.1-devel librsvg2-devel libappindicator-gtk3-devel nodejs npm rpm-build
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm

  # The oldest supported Ubuntu: the .deb and the AppImage then run on newer glibc too.
  debian:
    needs: verify-tag
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  arch:
    needs: [verify-tag, debian]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: packaging/arch
      - name: Build the package
        run: |
          pacman -Syu --noconfirm --needed base-devel jq
          version=$(jq -r .version src-tauri/tauri.conf.json)
          deb_file=$(ls packaging/arch/*.deb | head -n1)
          deb_sha=$(sha256sum "$deb_file" | awk '{print $1}')
          sed -i "s/^pkgver=.*/pkgver=${version}/" packaging/arch/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${deb_sha}')/" packaging/arch/PKGBUILD
          useradd -m builder
          chown -R builder packaging/arch
          cd packaging/arch
          # Dependencies are only needed to run the app, not to repack it.
          sudo -u builder makepkg --nodeps --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst

  macos:
    needs: verify-tag
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles app,dmg --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    needs: verify-tag
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  # Only this job receives contents:write so untrusted build steps never hold write tokens.
  release:
    needs: [fedora, debian, arch, macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          id=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            # The id comes from the create response itself: the release list lags behind a fresh draft.
            id=$(gh api --method POST "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="Smart Subtitles $TAG" -F draft=true \
              -f body='Fedora — `.rpm`, Debian/Ubuntu — `.deb`, любой Linux — `.AppImage`, Arch — `.pkg.tar.zst`, macOS (Apple Silicon и Intel) — `.dmg`, Windows — `-setup.exe`. Checksums: `SHA256SUMS.txt`. Установка описана в README.' \
              --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "::error::Не удалось создать релиз $TAG"
            exit 1
          fi
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            gh api --method POST -H 'Content-Type: application/octet-stream' \
              "https://uploads.github.com/repos/${GH_REPO}/releases/${id}/assets?name=$(basename "$f")" \
              --input "$f" > /dev/null
          done
